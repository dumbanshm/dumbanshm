<svg xmlns="http://www.w3.org/2000/svg" width="412" height="176" viewBox="0 0 412 176" role="img"><style>
text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;fill:#dfe5ec}
.m{fill:#9aa6b4}.d{fill:#5f6c7c}.ok{fill:#2dd4bf}.warn{fill:#fbbf24}.crit{fill:#f87171}.chem{fill:#a78bfa}.blue{fill:#60a5fa}
.b{font-weight:700}
.fade{opacity:0;animation:fade .6s ease-out forwards}
.rise{opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.slide{opacity:0;animation:slide .5s ease-out forwards}
.draw{animation:draw 1s ease-out forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
</style><rect x=".5" y=".5" width="411" height="175" rx="12" fill="#0b0f14" stroke="#1e2732"/><rect x="0" y="16" width="3" height="28" rx="1.5" fill="#a78bfa"/><text x="20" y="36" font-size="17" class="b slide" style="animation-delay:0.10s">InSilicomate</text><circle cx="342" cy="31" r="4" fill="#9aa6b4" class=""/><text x="352" y="35" font-size="11" style="fill:#9aa6b4" class="b">OSS</text><text x="20" y="64" font-size="12.5" class="fade" style="animation-delay:0.25s">Consensus binding-site finder (CASTp × COACH-D)</text><text x="20" y="82" font-size="12.5" class="fade" style="animation-delay:0.33s">that auto-preps AutoDock Vina docking runs, with</text><text x="20" y="100" font-size="12.5" class="fade" style="animation-delay:0.41s">3D pocket viewer.</text><line x1="20" y1="136" x2="392" y2="136" stroke="#1e2732"/><text x="20" y="159" font-size="11" class="m fade" style="animation-delay:0.60s">Python · 3Dmol.js · AutoDock Vina</text><text x="20" y="124" font-size="11.5" class="fade" style="fill:#a78bfa;animation-delay:.7s">▸ structural bio</text></svg>